name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Self-hosted (`fun`), not `ubuntu-latest`: the org runs a $3 Actions budget with
  # `prevent_further_usage`, and once it is spent every GitHub-hosted job is refused
  # in ~3s with no logs. `actions/setup-dotnet` fetches the SDK into the runner's
  # tool cache, so the host needs no system .NET.
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # `setup-dotnet` installs to /usr/share/dotnet by default, which the runner
      # account cannot create. The tool cache is writable and persists between
      # runs, so the SDK downloads once rather than on every build. `runner.*` is
      # not available in a job-level `env`, hence per step; the action puts the
      # install dir on PATH, so the later dotnet steps need nothing.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.RdZurg -c Release

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.RdZurg.Tests -c Release

      - name: Package
        run: ./build.sh

      - name: Verify package
        run: python3 scripts/verify-package.py

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("src/Jellyfin.Plugin.RdZurg/Jellyfin.Plugin.RdZurg.csproj").findtext(".//Version"))')
          test "$RELEASE_TAG" = "v$VERSION"

      # Only the tag build feeds `release`, which is the one consumer, so an
      # untagged push has nothing to hand over. Uploading on every push spent
      # private artifact storage — billed by the GiB-hour against the same $3
      # budget that stops this pipeline — to keep a zip nothing ever downloaded.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: rd-zurg
          path: artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rd-zurg
          path: artifacts
      - name: Publish to the DMM catalog
        env:
          DMM_PUBLISH_TOKEN: ${{ secrets.DMM_PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-to-dmm.py "artifacts/rd-zurg_${RELEASE_TAG#v}.zip"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "RD zurg $RELEASE_TAG" --notes-file CHANGELOG.md artifacts/*.zip artifacts/*.sha256
